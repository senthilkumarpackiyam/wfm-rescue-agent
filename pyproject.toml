[project]
name = "wfm-rescue-agent"
version = "0.1.0"
description = "Intraday WFM Rescue Agent: detects, diagnoses and fixes a contact-centre day that breaks away from forecast."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Phase 1: data contracts, synthetic history, scenarios
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    # Phase 2: simulator, staffing maths, forecasting
    "simpy>=4.1",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    # Phase 3-4: agent, LLM, policy RAG
    "langgraph>=0.2",
    "anthropic>=0.40",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # Phase 5: dashboard
    "streamlit>=1.38",
    "plotly>=5.22",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
